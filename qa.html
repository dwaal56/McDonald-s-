<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McDonald's QA Checklist</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #DC143C;
      --golden-yellow: #FFC72C;
      --bg-white: #FFFFFF;
      --bg-light-grey: #F9F9F9;
      --text-black: #1A1A1A;
      --text-muted: #999999;
      --success-green: #27AE60;
      
      --font-display: 'Rubik', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-light-grey);
      color: var(--text-black);
      margin: 0;
      padding: 0;
    }
    .header {
      background: var(--primary-red);
      color: white;
      padding: 32px 16px;
      text-align: center;
    }
    .header h1 {
      font-family: var(--font-display);
      margin: 0;
      font-size: 32px;
    }
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.2);
      margin-top: 16px;
    }
    .progress-bar {
      height: 100%;
      background: var(--golden-yellow);
      width: 0%;
      transition: width 0.3s ease;
    }
    .stats {
      font-family: var(--font-mono);
      margin-top: 8px;
      font-size: 14px;
    }
    .container {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--bg-white);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .card h2 {
      font-family: var(--font-display);
      margin-top: 0;
      border-bottom: 2px solid var(--bg-light-grey);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .qa-item {
      display: flex;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid var(--bg-light-grey);
      cursor: pointer;
    }
    .qa-item:last-child { border-bottom: none; }
    .qa-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #ccc;
      border-radius: 4px;
      margin-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .qa-item.checked .qa-checkbox {
      background: var(--primary-red);
      border-color: var(--primary-red);
      color: white;
    }
    .qa-item.checked .qa-checkbox::after {
      content: '✓';
      font-weight: bold;
    }
    .priority {
      font-family: var(--font-display);
      font-weight: bold;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 99px;
      margin-left: auto;
    }
    .prio-critical { background: var(--primary-red); color: white; }
    .prio-high { background: #FF8C00; color: white; }
    .prio-medium { background: var(--golden-yellow); color: black; }
    .prio-low { background: var(--success-green); color: white; }
    .qa-desc { flex: 1; margin-right: 16px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🍔 McDonald's QA Checklist</h1>
    <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="stats" id="stats">0 / 0 complete · 0 CRITICAL remaining</div>
  </div>

  <div class="container" id="checklist-container">
    <!-- Rendered via JS -->
  </div>

  <script>
    const categories = [
      {
        name: "1. 🍔 Visual & Design QA",
        items: [
          { desc: "Fonts loading (Rubik, Inter, JetBrains Mono)", priority: "critical" },
          { desc: "Red/yellow brand colours accurate", priority: "high" },
          { desc: "Food images crisp and clear", priority: "high" },
          { desc: "Responsive grid functioning on all viewports", priority: "critical" },
          { desc: "Cards have correct warm-tinted shadow", priority: "medium" },
          { desc: "Typography scale is fluid with clamp()", priority: "medium" },
          { desc: "Hover states active on all interactive elements", priority: "low" },
          { desc: "SVG icons rendering correctly", priority: "low" }
        ]
      },
      {
        name: "2. ⚡ Functional QA",
        items: [
          { desc: "Carousel auto-rotation works", priority: "critical" },
          { desc: "Carousel touch-swipe works on mobile", priority: "high" },
          { desc: "Menu filter tabs functioning", priority: "critical" },
          { desc: "Add-to-cart buttons interactive", priority: "critical" },
          { desc: "Customize popup opens", priority: "high" },
          { desc: "Wishlist buttons save to localStorage", priority: "medium" },
          { desc: "Location search trigger works", priority: "high" },
          { desc: "Real-time menu search returns results", priority: "critical" },
          { desc: "Search dropdown correctly highlights exact/partial matches", priority: "high" },
          { desc: "Search handles typos gracefully", priority: "medium" },
          { desc: "Clicking search result triggers 'Order' or 'Navigate'", priority: "critical" }
        ]
      }
    ];

    let totalItems = 0;
    let completedItems = 0;
    let criticals = 0;
    let completedCriticals = 0;

    const container = document.getElementById('checklist-container');

    function updateStats() {
      const pBar = document.getElementById('progress-bar');
      const stats = document.getElementById('stats');
      pBar.style.width = `${(completedItems / totalItems) * 100}%`;
      stats.textContent = `${completedItems} / ${totalItems} complete · ${criticals - completedCriticals} CRITICAL remaining`;
    }

    categories.forEach((cat, catIndex) => {
      const card = document.createElement('div');
      card.className = 'card';
      const h2 = document.createElement('h2');
      h2.textContent = cat.name;
      card.appendChild(h2);

      cat.items.forEach((item, itemIndex) => {
        totalItems++;
        if(item.priority === 'critical') criticals++;

        const div = document.createElement('div');
        div.className = 'qa-item';
        
        const checkbox = document.createElement('div');
        checkbox.className = 'qa-checkbox';
        
        const desc = document.createElement('div');
        desc.className = 'qa-desc';
        desc.textContent = item.desc;
        
        const prio = document.createElement('div');
        prio.className = `priority prio-${item.priority}`;
        prio.textContent = item.priority.toUpperCase();

        div.appendChild(checkbox);
        div.appendChild(desc);
        div.appendChild(prio);

        div.addEventListener('click', () => {
          const isChecked = div.classList.toggle('checked');
          if (isChecked) {
            completedItems++;
            if (item.priority === 'critical') completedCriticals++;
          } else {
            completedItems--;
            if (item.priority === 'critical') completedCriticals--;
          }
          updateStats();
        });

        card.appendChild(div);
      });
      container.appendChild(card);
    });

    updateStats();
  </script>
</body>
</html>
